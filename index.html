<script type="text/plain" id="bridge">
const http = require('http'), PORT = process.env.PORT || 8787, UA = { 'User-Agent': 'Mozilla/5.0' };
let cookie = '', crumb = '';
let moomoo = { key: process.env.MOOMOO_KEY || '', secret: process.env.MOOMOO_SECRET || '', host: '127.0.0.1', port: 33333 };

async function auth() {
  const r = await fetch('https://fc.yahoo.com', { headers: UA, redirect: 'manual' });
  cookie = (r.headers.getSetCookie?.() || []).map(c => c.split(';')[0]).join('; ');
  crumb = await (await fetch('https://query1.finance.yahoo.com/v1/test/getcrumb', { headers: { ...UA, cookie } })).text();
}
async function yf(path) {
  for (let i = 0; i < 2; i++) {
    if (!crumb) await auth();
    const r = await fetch('https://query2.finance.yahoo.com' + path + (path.includes('?') ? '&' : '?') + 'crumb=' + encodeURIComponent(crumb), { headers: { ...UA, cookie } });
    if (r.ok) return r.json();
    crumb = '';
  }
  throw new Error('Yahoo request failed');
}

let mm = null, mmReady = false, mmErr = '', subd = new Set(), mmTimer = null;
function pbInit(ab) {
  const u = new Uint8Array(ab), o = {}; let i = 0;
  const vi = () => { let r = 0n, s = 0n, b; do { b = u[i++]; r |= BigInt(b & 127) << s; s += 7n; } while (b & 128); return r; };
  while (i < u.length) {
    const t = Number(vi()), f = t >> 3, w = t & 7;
    if (w === 0) { const v = vi(); if (f === 1) o.retType = Number(BigInt.asIntN(32, v)); if (f === 3) o.errCode = Number(BigInt.asIntN(32, v)); }
    else if (w === 2) { const n = Number(vi()); if (f === 2) o.retMsg = Buffer.from(u.subarray(i, i + n)).toString('utf8'); i += n; }
    else if (w === 1) i += 8; else if (w === 5) i += 4; else break;
  }
  return o;
}
function mmClose() {
  clearTimeout(mmTimer);
  try { if (mm && typeof mm.stop === 'function') mm.stop(); } catch (e) {}
  mm = null; mmReady = false;
}
function mmConnect() {
  mmClose();
  let M;
  try { M = require('moomoo-api'); }
  catch (e) { mmErr = 'moomoo-api not installed. Run: npm i moomoo-api'; return; }
  try {
    const C = M.default || M, me = new C();
    let refusal = null;
    mm = me; subd.clear(); mmErr = 'connecting';
    me.onlogin = (ret, msg) => {
      if (mm !== me) return;
      clearTimeout(mmTimer);
      mmReady = !!ret;
      if (ret) mmErr = '';
      else if (refusal) mmErr = 'OpenD refused: ' + (refusal.retMsg || 'no message');
      else mmErr = 'OpenD login failed: ' + (msg || 'check port and password');
    };
    me.start(moomoo.host, +moomoo.port, false, moomoo.key);
    const wb = me.websock;
    if (wb && typeof wb.sendBuff === 'function') {
      const orig = wb.sendBuff.bind(wb);
      wb.sendBuff = (cmd, buf, t) => {
        const p = orig(cmd, buf, t);
        return cmd !== 1 ? p : p.then(r => { try { if (r && r.buff) { const d = pbInit(r.buff); if (d.retType !== undefined && d.retType !== 0) refusal = d; } } catch (e) {} return r; });
      };
    }
    mmTimer = setTimeout(() => {
      if (mm === me && !mmReady && mmErr === 'connecting')
        mmErr = 'No login response from OpenD after 8s.';
    }, 8000);
  } catch (e) { mm = null; mmErr = e.message; }
}
process.on('uncaughtException', e => { if (mm && !mmReady) mmErr = 'OpenD error: ' + e.message; });
process.on('unhandledRejection', e => { if (mm && !mmReady) mmErr = 'OpenD error: ' + (e && e.message || e); });
const mmQuoteCache = new Map();
function moomooSecurity(code) {
  const raw = String(code || '').trim().toUpperCase().replace(/-US$/, '');
  const m = /^([A-Z.]+)(\d{6}[CP])(\d{8})$/.exec(raw);
  if (!m) return null;
  return { market: 11, code: m[1] + m[2] + String(Number(m[3])) };
}
function basicQuoteFromResponse(resp) {
  const body = resp && (resp.s2c || resp);
  const list = body && (body.basicQotList || body.basicQot || body.quoteList);
  const q = Array.isArray(list) ? list[0] : null;
  const n = q && Number(q.curPrice != null ? q.curPrice : q.lastPrice);
  return Number.isFinite(n) && n > 0 ? n : null;
}
async function moomooQuote(code) {
  const sec = moomooSecurity(code);
  if (!sec || !mm || !mmReady) return null;
  try {
    if (!subd.has(sec.code)) {
      const sr = await mm.Sub({ c2s: { securityList: [sec], subTypeList: [1], isSubOrUnSub: true, isRegOrUnRegPush: true } });
      if (sr && sr.retType != null && Number(sr.retType) !== 0) throw new Error(sr.retMsg || 'Sub failed');
      subd.add(sec.code);
    }
    const resp = await mm.GetBasicQot({ c2s: { securityList: [sec] } });
    const last = basicQuoteFromResponse(resp);
    if (!last) throw new Error('No valid price for ' + sec.code);
    const quote = { last, ts: Date.now(), code: sec.code };
    mmQuoteCache.set(String(code).toUpperCase(), quote);
    mmErr = '';
    return quote;
  } catch (e) {
    mmErr = e && e.message ? e.message : String(e);
    const cached = mmQuoteCache.get(String(code).toUpperCase());
    return cached && Date.now() - cached.ts < 30000 ? { ...cached, cached: true } : null;
  }
}
if (moomoo.key) mmConnect();

const E = encodeURIComponent;
const routes = {
  '/api/chain': q => yf(`/v7/finance/options/${E(q.symbol)}` + (q.date ? `?date=${q.date}` : '')),
  '/api/quote': q => yf(`/v7/finance/quote?symbols=${E(q.symbols)}`),
  '/api/chart': q => yf(`/v8/finance/chart/${E(q.symbol)}?range=${q.range || '6mo'}&interval=${q.interval || '1d'}`),
  '/api/moomoo/quote': async q => ({ quote: await moomooQuote(q.code) }),
  '/api/moomoo/status': async () => ({ configured: !!moomoo.key, connected: mmReady, error: mmErr, host: moomoo.host, port: moomoo.port }),
};

http.createServer(async (req, res) => {
  res.setHeader('Access-Control-Allow-Origin', '*');
  res.setHeader('Access-Control-Allow-Headers', 'content-type');
  if (req.method === 'OPTIONS') return res.end();
  const u = new URL(req.url, 'http://x'), q = Object.fromEntries(u.searchParams);
  const send = (c, o) => { res.writeHead(c, { 'Content-Type': 'application/json' }); res.end(JSON.stringify(o)); };
  try {
    if (req.method === 'POST' && u.pathname === '/api/moomoo/config') {
      let b = ''; for await (const c of req) b += c;
      const c = JSON.parse(b);
      for (const k of ['key', 'secret', 'host', 'port']) if (c[k] !== undefined && c[k] !== '' && c[k] !== null) moomoo[k] = c[k];
      mmConnect();
      return send(200, { ok: true });
    }
    const h = routes[u.pathname];
    if (!h) return send(404, { error: 'not found' });
    send(200, await h(q));
  } catch (e) { send(500, { error: e.message }); }
}).listen(PORT, '127.0.0.1', () => console.log('Bridge on http://127.0.0.1:' + PORT));
</script>

const N = x => {
  const t = 1 / (1 + .2316419 * Math.abs(x)),
        p = .3989423 * Math.exp(-x*x/2) * t * (.3193815 + t*(-.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274))));
  return x > 0 ? 1 - p : p;
};

function greeks(S,K,T,iv,call){
  const r=.045,sd=iv*Math.sqrt(T);
  if(sd<=0||T<=0) return {d:0,ga:0,th:0,ve:0};
  const d1=(Math.log(S/K)+(r+iv*iv/2)*T)/sd, d2=d1-sd, pdf=.3989423*Math.exp(-d1*d1/2);
  return {
    d: call ? N(d1) : N(d1)-1,
    ga: pdf/(S*iv*Math.sqrt(T)),
    th: (-S*pdf*iv/(2*Math.sqrt(T)) - (call?1:-1)*r*K*Math.exp(-r*T)*N(call?d2:-d2))/365,
    ve: S*pdf*Math.sqrt(T)/100
  };
}

const emaSeries=(a,n)=>{const k=2/(n+1),o=[];a.forEach((x,i)=>o.push(i?x*k+o[i-1]*(1-k):x));return o;};
const ema=(a,n)=>emaSeries(a,n).at(-1);
const rsi=(c,n=14)=>{if(c.length<=n)return 50;let g=0,l=0;for(let i=c.length-n;i<c.length;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d;}return l?100-100/(1+g/l):100;};
const hv=c=>{if(c.length<2)return .2;const x=c.slice(-21).map((v,i,a)=>i?Math.log(v/a[i-1]):0).slice(1),m=x.reduce((a,b)=>a+b,0)/x.length;return Math.sqrt(x.reduce((a,b)=>a+(b-m)**2,0)/Math.max(1,x.length-1))*Math.sqrt(252);};
const cl=(x,a=0,z=1)=>Math.max(a,Math.min(z,x));

// ==========================================
// REBUILT INTRADAY TECHNICAL ENGINE
// ==========================================
function intradayEngine(result){
  const q = result.indicators?.quote?.[0] || {}, ts = result.timestamp || [];
  const rows = (q.close || []).map((c, i) => ({
    c, h: q.high?.[i], l: q.low?.[i], o: q.open?.[i] || c, v: q.volume?.[i] || 0, t: ts[i] || 0
  })).filter(x => [x.c, x.h, x.l].every(Number.isFinite));

  if (rows.length < 15) {
    return { last: rows.at(-1)?.c || 0, vwap: 0, vwapSlope: 0, atr: 1, adx: 20, rvol: 1, pattern: 'Insufficient Bars', name: 'Sideways', bias: 0 };
  }

  const C = rows.map(x => x.c);
  const E5 = emaSeries(C, 5), E9 = emaSeries(C, 9), E20 = emaSeries(C, 20);

  // Cumulative Session VWAP (resets on day boundary)
  let pv = 0, vv = 0;
  const V = [];
  rows.forEach(x => {
    pv += ((x.h + x.l + x.c) / 3) * x.v;
    vv += x.v;
    V.push(vv > 0 ? pv / vv : x.c);
  });
  const vwap = V.at(-1);
  const vwapSlope = V.length > 3 ? (V.at(-1) - V.at(-4)) : 0;

  // ATR & ADX Calculation
  const tr = rows.map((x, i) => i ? Math.max(x.h - x.l, Math.abs(x.h - rows[i-1].c), Math.abs(x.l - rows[i-1].c)) : (x.h - x.l));
  const atr = tr.slice(-14).reduce((a, b) => a + b, 0) / Math.max(1, tr.slice(-14).length);

  let plus = 0, minus = 0, sumTr = 0;
  for (let i = Math.max(1, rows.length - 14); i < rows.length; i++) {
    const up = rows[i].h - rows[i-1].h, dn = rows[i-1].l - rows[i].l;
    plus += (up > dn && up > 0) ? up : 0;
    minus += (dn > up && dn > 0) ? dn : 0;
    sumTr += tr[i];
  }
  const pdi = sumTr ? (100 * plus / sumTr) : 0;
  const mdi = sumTr ? (100 * minus / sumTr) : 0;
  const adx = (pdi + mdi) ? (100 * Math.abs(pdi - mdi) / (pdi + mdi)) : 20;

  // Relative Volume
  const a = rows.at(-1), b = rows.at(-2), c = rows.at(-3);
  const avgVol = rows.slice(-25, -1).reduce((z, x) => z + x.v, 0) / Math.max(1, rows.slice(-25, -1).length);
  const rvol = avgVol > 0 ? Math.max(0.6, a.v / avgVol) : 1.0;

  // Opening Range & Key Levels
  const day = new Date(a.t * 1000).toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  const today = rows.filter(x => new Date(x.t * 1000).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }) === day);
  const opening = today.slice(0, 3); // 15m OR
  const orHigh = opening.length ? Math.max(...opening.map(x => x.h)) : null;
  const orLow = opening.length ? Math.min(...opening.map(x => x.l)) : null;

  const prior = rows.slice(0, -Math.max(1, today.length));
  const prevLow = prior.length ? Math.min(...prior.slice(-78).map(x => x.l)) : null;
  const prevHigh = prior.length ? Math.max(...prior.slice(-78).map(x => x.h)) : null;

  // Downtrend & Uptrend Scoring
  let bearScore = 0, bullScore = 0;
  if (a.c < vwap) bearScore += 30; else bullScore += 30;
  if (E9.at(-1) < E20.at(-1)) bearScore += 25; else bullScore += 25;
  if (a.c < E9.at(-1)) bearScore += 15; else bullScore += 15;
  if (vwapSlope < 0) bearScore += 15; else if (vwapSlope > 0) bullScore += 15;
  if (mdi > pdi) bearScore += 15; else bullScore += 15;

  let name = 'Sideways';
  if (bearScore >= 55) name = 'Downtrend';
  else if (bullScore >= 55) name = 'Uptrend';
  else if (adx > 20) name = 'Mixed';

  // Responsive Candlestick / Structural Pattern Recognition
  let pattern = 'Trend flow';
  if (name === 'Downtrend') {
    if (orLow && a.c < orLow) pattern = '15m OR breakdown';
    else if (prevLow && a.c < prevLow) pattern = 'Prior-day low breakdown';
    else if (b.h >= vwap && a.c < vwap) pattern = 'VWAP rejection';
    else if (a.c < b.l) pattern = 'Bearish continuation break';
    else if (E5.at(-1) < E9.at(-1) && E9.at(-1) < E20.at(-1)) pattern = 'Bearish EMA cascade';
  } else if (name === 'Uptrend') {
    if (orHigh && a.c > orHigh) pattern = '15m OR breakout';
    else if (prevHigh && a.c > prevHigh) pattern = 'Prior-day high breakout';
    else if (b.l <= vwap && a.c > vwap) pattern = 'VWAP bounce / reclaim';
    else if (a.c > b.h) pattern = 'Bullish continuation break';
    else if (E5.at(-1) > E9.at(-1) && E9.at(-1) > E20.at(-1)) pattern = 'Bullish EMA cascade';
  }

  const bias = bearScore >= 55 ? -bearScore : bullScore >= 55 ? bullScore : 0;
  return { last: a.c, vwap, vwapSlope, atr, adx, rvol, pattern, name, bias };
}

// ==========================================
// REBUILT AUTO-PICK SELECTION & PRICING
// ==========================================
function pick(o, S, T, call, m, b, fs, H, ed, tech) {
  const iv = Number(o.impliedVolatility) || 0;
  const bid = Number(o.bid) || 0, ask = Number(o.ask) || 0;
  const lastPrice = Number(o.lastPrice) || 0;
  const mid = (bid > 0 && ask > 0) ? ((bid + ask) / 2) : lastPrice;
  const oi = Number(o.openInterest) || 0;
  const vol = Number(o.volume) || 0;

  // Basic Liquidity Guards (must have workable pricing and open interest)
  if (mid < 0.20 || (oi < 40 && vol < 20) || iv <= 0) return null;

  const g = greeks(S, o.strike, T, iv, call);
  const absDelta = Math.abs(g.d);

  // Delta Sweetspot: Intraday options require active movement (~0.32 to 0.70 Delta)
  if (absDelta < 0.25 || absDelta > 0.78) return null;

  const sp = (bid > 0 && ask > 0) ? ((ask - bid) / mid) : 0.08;
  // Exclude extremely illiquid spreads
  if (sp > 0.25) return null;

  const id = m === 'intraday';
  const isPut = !call;
  const matchesTrend = (call && tech.name === 'Uptrend') || (isPut && tech.name === 'Downtrend');
  const isCounterTrend = (call && tech.name === 'Downtrend') || (isPut && tech.name === 'Uptrend');

  // Hard drop if trading counter to strong trend
  if (id && isCounterTrend) return null;

  // Dynamic Multi-Factor Score (0 - 100)
  let score = 25; // Base score
  if (matchesTrend) score += 25;
  score += 15 * (1 - Math.min(1, Math.abs(absDelta - 0.48) / 0.25)); // Target ~0.48 delta
  score += 12 * Math.max(0, 1 - (sp / 0.15)); // Spread tightness
  score += 8 * Math.min(1, (vol + oi / 2) / 800); // Liquidity
  score += 8 * Math.min(1, tech.adx / 30); // Trend strength
  score += 7 * (tech.pattern.includes('break') || tech.pattern.includes('rejection') ? 1 : 0.4);

  // Earnings penalty if holding near announcement
  if (ed < 1) score -= 15;

  score = Math.round(cl(score, 0, 99));

  // Realistic Tier Mapping for Active Day Trading
  const tier = score >= 70 ? 'Strict' : score >= 54 ? 'Balanced' : score >= 42 ? 'Aggressive' : null;
  if (!tier) return null;

  // Intraday Risk-to-Reward (Default 1:1.5 to 1:2 R:R)
  const stopLoss = Math.max(0.05, mid * (id ? 0.78 : 0.65));
  const targetPrice = mid * (id ? 1.35 : 1.70);

  return {
    code: o.contractSymbol,
    k: o.strike,
    bid,
    ask,
    mid,
    iv,
    d: g.d,
    ga: g.ga,
    th: g.th,
    ve: g.ve,
    oi,
    v: vol,
    spread: sp,
    score,
    tier,
    earn: ed < 1,
    stop: stopLoss,
    tgt: targetPrice,
    regime: tech.name,
    pattern: tech.pattern,
    vwap: tech.vwap,
    vwapSlope: tech.vwapSlope,
    adx: tech.adx,
    atr: tech.atr,
    rvol: tech.rvol
  };
}

// ==========================================
// ANALYSIS ENGINE
// ==========================================
async function analyze(sym) {
  const E = encodeURIComponent(sym);
  const [daily, intra, qt, c0] = await Promise.all([
    api(`/api/chart?symbol=${E}&range=6mo&interval=1d`),
    api(`/api/chart?symbol=${E}&range=5d&interval=5m`),
    api(`/api/quote?symbols=${E}`),
    api(`/api/chain?symbol=${E}`)
  ]);

  const dc = (daily.chart?.result?.[0]?.indicators?.quote?.[0]?.close || []).filter(Number.isFinite);
  const q = qt.quoteResponse?.result?.[0] || {};
  const S = dc.at(-1) || q.regularMarketPrice || 100;
  const tech = intradayEngine(intra.chart?.result?.[0] || {});
  const e20 = ema(dc, 20), e50 = ema(dc, 50), R = rsi(dc), H = hv(dc);
  const chg = q.regularMarketChangePercent || 0;

  // Composite Macro Bias (-100 to +100)
  let b = 0;
  b += (S > e20 ? 15 : -15);
  b += (e20 > e50 ? 15 : -15);
  b += (R > 55 ? 10 : R < 45 ? -10 : 0);
  b += (chg > 0.4 ? 15 : chg < -0.4 ? -15 : 0);
  b += (tech.bias !== 0 ? tech.bias * 0.45 : 0);

  // Direction: If intraday is in a clear trend, prioritize intraday regime over multi-month lag
  let call = true;
  if (tech.name === 'Downtrend') call = false;
  else if (tech.name === 'Uptrend') call = true;
  else call = b >= 0;

  const etf = q.quoteType === 'ETF' || sym.startsWith('^') || ['SPY','QQQ','IWM'].includes(sym);
  let f = 5;
  if (!etf) {
    const ar = parseFloat(q.averageAnalystRating) || 3;
    f += (ar < 2.2 ? 3 : ar > 3 ? -3 : 0);
  }
  const ed = q.earningsTimestamp ? (q.earningsTimestamp * 1000 - Date.now()) / 864e5 : 99;
  const fs = (call ? f : (10 - f)) / 10;

  const ex = c0.optionChain?.result?.[0]?.expirationDates || [];
  if (!ex.length) return { picks: [], regime: tech };

  const nowSec = Date.now() / 1000;
  const out = [];

  for (const m of ['intraday', 'swing']) {
    // Select Expiration: Intraday selects 0 DTE or nearest active (<= 4 days)
    let targetExp = null;
    if (m === 'intraday') {
      targetExp = ex.find(e => (e - nowSec) > -43200 && (e - nowSec) <= 4 * 86400) || ex[0];
    } else {
      targetExp = ex.find(e => (e - nowSec) >= 4 * 86400 && (e - nowSec) <= 18 * 86400) || ex[1] || ex[0];
    }

    if (!targetExp) continue;

    const res = (await api(`/api/chain?symbol=${E}&date=${targetExp}`)).optionChain?.result?.[0];
    if (!res || !res.options?.[0]) continue;

    const op = res.options[0];
    const S2 = res.quote?.regularMarketPrice || S;
    const daysToExpiry = Math.max(0.08, (targetExp - nowSec) / 86400);
    const T = daysToExpiry / 365;

    // Evaluate contracts for candidate direction
    const candidates = call ? (op.calls || []) : (op.puts || []);
    const matchedPicks = candidates
      .map(o => pick(o, S2, T, call, m, b, fs, H, ed, tech))
      .filter(Boolean)
      .sort((p1, p2) => p2.score - p1.score)
      .slice(0, 3)
      .map(p => ({ ...p, sym, m, call, exp: targetExp, b: Math.round(b), R: Math.round(R) }));

    out.push(...matchedPicks);
  }

  return { picks: out, regime: tech };
}

function updateRegime(rs){
  const c = { Uptrend: 0, Downtrend: 0, Sideways: 0, Mixed: 0 };
  rs.forEach(x => { if (x && x.name) c[x.name]++; });
  const top = Object.entries(c).sort((a,b) => b[1] - a[1])[0];
  const n = Math.max(1, rs.length);
  marketRegime = {
    name: top[1] ? top[0] : 'Waiting',
    confidence: Math.round(100 * top[1] / n),
    up: c.Uptrend,
    down: c.Downtrend,
    sideways: c.Sideways,
    mixed: c.Mixed,
    updated: Date.now()
  };
}

async function scan() {
  if (busy) return;
  busy = true;
  picks = [];
  msg = 'Connecting to bridge...';
  render();
  const regimes = [];
  const symbols = cfg.uni.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);

  for (const s of symbols) {
    msg = 'Scanning ' + s + '…';
    render();
    try {
      const result = await analyze(s);
      picks.push(...result.picks);
      regimes.push(result.regime);
    } catch(e) {
      console.warn('Bridge fetch error for ' + s + ':', e.message);
    }
  }

  updateRegime(regimes);
  busy = false;
  msg = picks.length ? ('Synced: ' + new Date().toLocaleTimeString()) : 'Bridge offline or zero strikes returned';
  render();
}

let refreshQueued = false;
const roundPrice = v => Math.round((Number(v) || 0) * 100) / 100;

function add(code) {
  const p = picks.find(x => x.code === code);
  if (!p) return;
  const now = Date.now();
  const initPrice = roundPrice(p.mid);
  const stopRatio = p.mid > 0 ? (p.stop / p.mid) : 0.78;
  const tgtRatio = p.mid > 0 ? (p.tgt / p.mid) : 1.35;

  cfg.pos.push({
    id: now,
    sym: p.sym,
    code,
    k: p.k,
    call: p.call,
    exp: p.exp,
    qty: 1,
    entry: initPrice,
    live: initPrice,
    stop: roundPrice(p.stop),
    tgt: roundPrice(p.tgt),
    stopRatio,
    tgtRatio,
    openedAt: now,
    tier: p.tier,
    score: p.score,
    src: 'At add time',
    ts: now,
    entrySynced: false,
    manualEntry: false,
    manualStop: false,
    manualTgt: false
  });
  save();
  setTab('paper');
}

function ed(i, k, v) {
  const pos = cfg.pos[i];
  if (!pos) return;
  pos[k] = Math.max(0, +v);
  if (k === 'entry') { pos.manualEntry = true; pos.entrySynced = true; }
  else if (k === 'stop') pos.manualStop = true;
  else if (k === 'tgt') pos.manualTgt = true;
  save();
  render();
}

function applyQuoteToPosition(p, rawPrice, src, quoteTs) {
  const price = roundPrice(rawPrice);
  if (!(price > 0)) return false;

  if (p.entrySynced === false && !p.manualEntry) {
    p.entry = price;
    p.live = price;
    if (!p.manualStop) p.stop = roundPrice(price * (p.stopRatio || 0.78));
    if (!p.manualTgt) p.tgt = roundPrice(price * (p.tgtRatio || 1.35));
    p.entrySynced = true;
    p.entrySyncedAt = Date.now();
    p.src = src;
    p.ts = quoteTs || Date.now();
    return false;
  }

  p.entrySynced = true;
  p.live = price;
  p.src = src;
  p.ts = quoteTs || Date.now();
  return true;
}

function targetProgress(p) {
  const entry = Number(p.entry), live = Number(p.live), target = Number(p.tgt);
  if (!(entry > 0) || !(live > 0) || !(target > entry)) {
    return `<div class="target-progress"><span class="mu">Unavailable</span></div>`;
  }
  const raw = ((live - entry) / (target - entry)) * 100;
  const pct = Math.max(0, Math.min(100, raw));
  const remaining = Math.max(0, target - live);
  let cls = 'target-loss', color = 'var(--red)', state = 'Below entry';
  if (live >= target) { cls = 'reached'; color = 'var(--green)'; state = 'Target reached'; }
  else if (raw >= 80) { cls = 'target-high'; color = 'var(--green)'; state = `$${remaining.toFixed(2)} remaining`; }
  else if (raw >= 50) { cls = 'target-mid'; color = 'var(--blue)'; state = `$${remaining.toFixed(2)} remaining`; }
  else if (raw >= 0) { cls = 'target-low'; color = 'var(--amber)'; state = `$${remaining.toFixed(2)} remaining`; }
  return `<div class="target-progress">
    <div class="progress-meta"><span class="progress-label" style="color:${color}"><span class="progress-dot"></span>${raw.toFixed(0)}%</span><span>${state}</span></div>
    <div class="progress-track"><div class="progress-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
    <div class="progress-meta"><span>Entry $${entry.toFixed(2)}</span><span>Target $${target.toFixed(2)}</span></div>
  </div>`;
}

function stopLossProgress(p) {
  const entry = Number(p.entry), live = Number(p.live), stop = Number(p.stop);
  if (!(entry > 0) || !(live > 0) || !(stop >= 0) || !(entry > stop)) {
    return `<div class="target-progress"><span class="mu">Unavailable</span></div>`;
  }
  const buffer = entry - stop;
  const remaining = live - stop;
  const safetyRaw = (remaining / buffer) * 100;
  const pct = Math.max(0, Math.min(100, safetyRaw));
  let cls = 'stop-safe', color = 'var(--green)', state = `$${Math.max(0,remaining).toFixed(2)} above stop`;
  if (live <= stop) { cls = 'stop-hit'; color = 'var(--red)'; state = 'Stop reached'; }
  else if (safetyRaw <= 25) { cls = 'stop-danger'; color = 'var(--red)'; state = `$${remaining.toFixed(2)} above stop`; }
  else if (safetyRaw <= 60) { cls = 'stop-warn'; color = 'var(--amber)'; state = `$${remaining.toFixed(2)} above stop`; }
  return `<div class="target-progress">
    <div class="progress-meta"><span class="progress-label" style="color:${color}"><span class="progress-dot"></span>${safetyRaw.toFixed(0)}% safety</span><span>${state}</span></div>
    <div class="progress-track"><div class="progress-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>
    <div class="progress-meta"><span>Stop $${stop.toFixed(2)}</span><span>Entry $${entry.toFixed(2)}</span></div>
  </div>`;
}

function csvCell(v) {
  const text = v == null ? '' : String(v);
  return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}

function exportCloseReasonsCSV() {
  if (!cfg.closed.length) { alert('No closed positions to export.'); return; }
  const headers = ['Contract','Symbol','Expiry','Type','Strike','Setup Tier','Setup Score','Opened Time','Quantity','Entry Price','Exit Price','Target At Close','Stop Loss','Close Reason','Auto Closed','Quote Source','Realized P&L','Fees'];
  const rows = cfg.closed.map(p => {
    const auto = String(p.closeReason || '').startsWith('Auto-close');
    return [p.code, p.sym, p.exp, p.call?'C':'P', p.k, normalizedTier(p), p.score, p.openedAt ? new Date(Number(p.openedAt)).toISOString() : '', p.qty, p.entry, p.exitPrice, p.targetAtClose, p.stop, p.closeReason, auto?'Yes':'No', p.src, p.realizedPL, p.feeTotal];
  });
  const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = `paper-trading-close-reasons-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function closeExplanation(p) {
  const auto = String(p.closeReason || '').startsWith('Auto-close');
  const exit = Number(p.exitPrice), target = Number(p.targetAtClose != null ? p.targetAtClose : p.tgt);
  const source = p.quoteSourceAtClose || p.src || 'Live quote';
  if (auto) {
    return `<div class="close-why"><div class="reason">Target condition met</div><div>Live $${exit.toFixed(2)} ≥ Target $${target.toFixed(2)}</div><div class="evidence">${source}</div></div>`;
  }
  return `<div class="close-why"><div class="reason">${p.closeReason || 'Manual close'}</div><div class="evidence">Closed at $${exit.toFixed(2)} · ${source}</div></div>`;
}

function closePos(i, reason = 'Manual close') {
  const p = cfg.pos[i];
  if (!p) return;
  const feeTotal = 2 * cfg.fee * p.qty;
  const realizedPL = (p.live - p.entry) * 100 * p.qty - feeTotal;
  cfg.closed.push({
    ...p,
    exitPrice: p.live,
    realizedPL,
    feeTotal,
    closedAt: Date.now(),
    closeReason: reason,
    targetAtClose: Number(p.tgt),
    quoteSourceAtClose: p.src || 'Direct',
    quoteTimeAtClose: Number(p.ts) || Date.now()
  });
  cfg.pos.splice(i, 1);
  save();
  render();
}

function normalizedTier(p) {
  const raw = String(p && p.tier || '').trim().toLowerCase();
  if (raw.startsWith('strict')) return 'Strict';
  if (raw.startsWith('balanc')) return 'Balanced';
  if (raw.startsWith('aggress')) return 'Aggressive';
  return '';
}

function setupTierTag(p) {
  const tierName = normalizedTier(p);
  const score = Number(p && p.score);
  if (!tierName) return '<span class="mu">Not captured</span>';
  return `<span class="tag ${tierName}">${tierName}${Number.isFinite(score) ? score : ''}</span>`;
}

function tradeDateTime(value) {
  const ms = Number(value);
  if (!Number.isFinite(ms) || ms <= 0) return '<span class="mu">--</span>';
  const d = new Date(ms);
  return `<div class="trade-datetime"><div class="date">${d.toLocaleDateString()}</div><div class="time">${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div></div>`;
}

function paperTierMatch(p, selected) {
  return selected === 'All' || normalizedTier(p) === selected;
}

function paperPL(p, closed = false) {
  if (closed) return Number.isFinite(Number(p.realizedPL)) ? Number(p.realizedPL) : 0;
  return (Number(p.live) - Number(p.entry)) * 100 * Number(p.qty || 0) - (2 * Number(cfg.fee || 0) * Number(p.qty || 0));
}

function paperSortRows(rows, sort, closed = false) {
  return rows.sort((a,b) => {
    if (sort === 'lowest') return paperPL(a.p, closed) - paperPL(b.p, closed);
    const aTime = Number(closed ? a.p.closedAt : (a.p.openedAt || a.p.id)) || 0;
    const bTime = Number(closed ? b.p.closedAt : (b.p.openedAt || b.p.id)) || 0;
    return bTime - aTime;
  });
}

function setPaperFilter(kind, value) {
  if (kind === 'openTier') openTierFilter = value;
  if (kind === 'openSort') openSort = value;
  if (kind === 'closedTier') closedTierFilter = value;
  if (kind === 'closedSort') closedSort = value;
  render();
}

  let activeTot = 0, closedTot = 0, totalFees = 0;
  const openView = paperSortRows(cfg.pos.map((p,i) => ({p,i})).filter(x => paperTierMatch(x.p, openTierFilter)), openSort, false);

  const activeRows = openView.map(({p, i}) => {

    return `<tr>

      <td>

          <button class="btn sm danger" title="Delete without logging" onclick="cfg.pos.splice(${i},1);save();render()">✕</button>

  }).join('');

  const closedView = paperSortRows(cfg.closed.map((p,i) => ({p,i})).filter(x => paperTierMatch(x.p, closedTierFilter)), closedSort, true);
  const closedRows = closedView.map(({p, i}) => {
    const fee = p.feeTotal != null ? p.feeTotal : (2 * cfg.fee * p.qty);
    const pl = p.realizedPL;
    closedTot += pl;
    totalFees += fee;
    return `<tr>
      <td>
        <div class="sym-name">${lbl(p)}</div>
        <div class="sym-sub mono">${p.code}</div>
      </td>
      <td>${setupTierTag(p)}</td>
      <td>${tradeDateTime(p.openedAt || p.id)}</td>
      <td>${tradeDateTime(p.closedAt)}</td>
      <td class="mono">${p.qty}</td>
      <td class="mono">${p.entry.toFixed(2)}</td>
      <td class="mono">
        Exit: <b>${p.exitPrice.toFixed(2)}</b>
        <div class="sym-sub">${p.closeReason || 'Manual close'}</div>
      </td>
      <td>${closeExplanation(p)}</td>
      <td class="mono ${pl >= 0 ? 'g' : 'r'} font-weight-bold">${pl >= 0 ? '+' : ''}${pl.toFixed(2)}</td>
      <td class="mono mu">${fee.toFixed(2)}</td>
      <td>
        <div class="actions-cell">
          <button class="btn sm" title="View Moomoo chart" onclick="openMoomooChart('${p.code}')">Chart ↗</button>
          <button class="btn sm danger" title="Delete record" onclick="cfg.closed.splice(${i},1);save();render()">✕</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  const grandTot = activeTot + closedTot;

  return `
  <div class="kpi-deck">
    <div class="kpi-card">
      <div class="kpi-label">Combined Net P&amp;L</div>
      <div class="kpi-val ${grandTot >= 0 ? 'g' : 'r'}">${grandTot >= 0 ? '+' : ''}$${grandTot.toFixed(2)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Active Unrealized</div>
      <div class="kpi-val ${activeTot >= 0 ? 'g' : 'r'}">${activeTot >= 0 ? '+' : ''}$${activeTot.toFixed(2)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Closed Realized</div>
      <div class="kpi-val ${closedTot >= 0 ? 'g' : 'r'}">${closedTot >= 0 ? '+' : ''}$${closedTot.toFixed(2)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Moomoo Total Fees (Roundtrip)</div>
      <div class="kpi-val mu">$${totalFees.toFixed(2)}</div>
    </div>
  </div>

  <div class="row" style="justify-content: space-between;">
    <div class="mu font-weight-bold">OPEN POSITIONS (${openView.length} of ${cfg.pos.length})</div>
    <div class="row" style="margin:0">
      <span class="paper-filter-label">Tier</span>
      <select class="paper-filter" onchange="setPaperFilter('openTier',this.value)">
        ${['All','Strict','Balanced','Aggressive'].map(x => `<option value="${x}" ${openTierFilter===x?'selected':''}>${x === 'All' ? 'All setup tiers' : x}</option>`).join('')}
      </select>
      <span class="paper-filter-label">Show</span>
      <select class="paper-filter" onchange="setPaperFilter('openSort',this.value)">
        <option value="newest" ${openSort==='newest'?'selected':''}>Newest first</option>
        <option value="lowest" ${openSort==='lowest'?'selected':''}>Lowest P&amp;L first</option>
      </select>
      <span class="${cfg.autoCloseTarget ? 'auto-badge' : 'mu'}">Auto-close at target: ${cfg.autoCloseTarget ? 'ON' : 'OFF'}</span>
      <button class="btn sm ${cfg.autoCloseTarget ? 'warn' : 'pri'}" onclick="cfg.autoCloseTarget=!cfg.autoCloseTarget;save();render()">${cfg.autoCloseTarget ? 'Disable' : 'Enable'}</button>
      <button class="btn sm" onclick="refresh(true)">Refresh live prices</button>
    </div>
  </div>
  <div class="wrap"><table>
    <thead>
      <tr>
        <th>Contract</th>
        <th>Setup Tier</th>
        <th>Opened Date &amp; Time</th>
        <th>Qty</th>
        <th>Entry ($)</th>
        <th>Stop Loss → Target</th>
        <th>Target Progress</th>
        <th>Stop-Loss Progress</th>
        <th>Live Price</th>
        <th>Net P&amp;L</th>
        <th>Fees</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      ${activeRows || '<tr><td colspan="12" class="mu" style="text-align:center; padding:24px;">No open positions match the selected setup tier.</td></tr>'}
    </tbody>
  </table></div>

  ${cfg.closed.length ? `
  <div class="row" style="justify-content: space-between; margin-top: 24px;">

    <div class="row" style="margin:0">
      <span class="paper-filter-label">Tier</span>
      <select class="paper-filter" onchange="setPaperFilter('closedTier',this.value)">
        ${['All','Strict','Balanced','Aggressive'].map(x => `<option value="${x}" ${closedTierFilter===x?'selected':''}>${x === 'All' ? 'All setup tiers' : x}</option>`).join('')}
      </select>
      <span class="paper-filter-label">Show</span>
      <select class="paper-filter" onchange="setPaperFilter('closedSort',this.value)">
        <option value="newest" ${closedSort==='newest'?'selected':''}>Newest first</option>
        <option value="lowest" ${closedSort==='lowest'?'selected':''}>Lowest P&amp;L first</option>
      </select>
      <button class="btn sm pri" onclick="exportCloseReasonsCSV()">Export Close Reasons CSV</button>
      <button class="btn sm danger" onclick="if(confirm('Clear all closed trades?')){cfg.closed=[];save();render();}">Clear Closed Trades</button>
    </div>
  </div>
  <div class="wrap"><table>
    <thead>
      <tr>
        <th>Contract</th>
        <th>Setup Tier</th>
        <th>Opened Date &amp; Time</th>
        <th>Closed Date &amp; Time</th>
        <th>Qty</th>
        <th>Entry</th>
        <th>Exit &amp; Target Setup</th>
        <th>Why Closed</th>
        <th>Realized P&amp;L</th>
        <th>Fees Paid</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      ${closedRows || '<tr><td colspan="11" class="mu" style="text-align:center;padding:24px;">No closed positions match the selected setup tier.</td></tr>'}
    </tbody>
  </table></div>` : ''}`;
}

async function refresh(manual = false) {
  if (!cfg.pos.length) return;
  if (refreshing) { refreshQueued = true; return; }
  refreshing = true;

  try {
    const snapshot = [...cfg.pos];
    const moomooResults = await Promise.all(snapshot.map(async p => {
      try {
        const data = await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code));
        const q = data && data.quote;
        return (q && Number(q.last) > 0)
          ? { p, price: Number(q.last), ts: Number(q.ts) || Date.now(), cached: !!q.cached }
          : null;
      } catch (e) { return null; }
    }));

    const gotMoomoo = new Set();
    const updatedPostEntry = new Set();

    for (const r of moomooResults) {
      if (!r || !cfg.pos.includes(r.p)) continue;
      if (r.cached && r.p.entrySynced !== false && r.ts < (r.p.openedAt || 0)) continue;
      const isPostEntryUpdate = applyQuoteToPosition(r.p, r.price, r.cached ? 'Moomoo cached' : 'Moomoo live', r.ts);
      if (isPostEntryUpdate) updatedPostEntry.add(r.p);
      gotMoomoo.add(r.p.code);
    }

    const fallback = cfg.pos.filter(p => !gotMoomoo.has(p.code));
    const groups = {};
    fallback.forEach(p => (groups[p.sym + '|' + p.exp] ??= []).push(p));

    for (const key of Object.keys(groups)) {
      try {
        const [sym, exp] = key.split('|');
        const data = await api(`/api/chain?symbol=${encodeURIComponent(sym)}&date=${encodeURIComponent(exp)}`);
        const option = data.optionChain.result[0].options[0];
        groups[key].forEach(p => {
          const c = [...option.calls, ...option.puts].find(x => x.contractSymbol === p.code);
          if (!c) return;
          const bid = Number(c.bid), ask = Number(c.ask), last = Number(c.lastPrice);
          let price = NaN;
          if (bid > 0 && ask > 0) price = (bid + ask) / 2;
          else if (last > 0) price = last;

          if (Number.isFinite(price) && price > 0) {
            const isPostEntryUpdate = applyQuoteToPosition(p, price, 'Yahoo fallback', Date.now());
            if (isPostEntryUpdate) updatedPostEntry.add(p);
          }
        });
      } catch (e) {}
    }

    if (cfg.autoCloseTarget) {
      for (let i = cfg.pos.length - 1; i >= 0; i--) {
        const p = cfg.pos[i], live = Number(p.live), target = Number(p.tgt);
        if (updatedPostEntry.has(p) && live > 0 && target > 0 && live >= target && p.ts) {
          closePos(i, 'Auto-close: target reached');
        }
      }
    }
    save();
  } finally {
    refreshing = false;
    if (tab === 'paper' && document.activeElement.tagName !== 'INPUT') render();
    if (refreshQueued) {
      refreshQueued = false;
      refresh();
    }
  }
}

function rSet() {
  return `<div class="set">
    <h3 style="margin-top:0">Terminal Configuration</h3>
    <label>Local Bridge URL</label>
    <input id="b" value="${cfg.bridge}">
    
    <label>Watchlist Symbols (Comma separated)</label>
    <input id="u" value="${cfg.uni}">

    <label>Moomoo Fee per Contract ($/side, default: $0.69)</label>
    <input id="f" value="${cfg.fee}">

    <div style="margin-top: 16px;">
      <button class="btn pri" onclick="sv()">Save Settings</button>
      <button class="btn" onclick="dl()">Download Bridge (server.js)</button>
    </div>

    <h3 style="margin-top:28px">Moomoo OpenAPI Direct Gateway</h3>
    <label>OpenD Host</label>
    <input id="mh" value="127.0.0.1">

    <label>OpenD WebSocket Port</label>
    <input id="mp" value="33333">

    <label>OpenD WebSocket Key</label>
    <input id="mk" autocomplete="off" placeholder="Leave blank if unchanged">

    <div style="margin-top: 16px;">
      <button class="btn" onclick="mm()">Connect Gateway</button>
      <span id="mst" class="mu mono" style="margin-left: 8px;"></span>
    </div>
  </div>`;
}

function dl() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('#bridge').textContent.trim() + '\n'], { type: 'text/javascript' }));
  a.download = 'server.js';
  a.click();
}

function sv() {
  cfg.bridge = $('#b').value.trim();
  cfg.uni = $('#u').value;
  cfg.fee = +$('#f').value || 0;
  save();
  ping();
  alert('Settings saved successfully.');
  render();
}

async function mm() {
  const out = $('#mst');
  out.className = 'mu mono';
  try {
    await fetch(cfg.bridge + '/api/moomoo/config', {
      method: 'POST',
      body: JSON.stringify({ key: $('#mk').value, host: $('#mh').value, port: +$('#mp').value })
    });
    $('#mk').value = '';
    for (let i = 1; i <= 10; i++) {
      out.textContent = 'Connecting to OpenD… ' + i + 's';
      await new Promise(r => setTimeout(r, 1000));
      const s = await api('/api/moomoo/status');
      if (s.connected) {
        out.className = 'g mono';
        out.textContent = '✔ Connected to OpenD at ' + s.host + ':' + s.port;
        ping();
        return;
      }
      if (s.error && s.error !== 'connecting') {
        out.className = 'r mono';
        out.textContent = '✖ ' + s.error;
        return;
      }
    }
    out.className = 'r mono';
    out.textContent = '✖ Timed out waiting for OpenD.';
  } catch(e) {
    out.className = 'r mono';
    out.textContent = 'Bridge connection failed.';
  }
}

async function ping() {
  try {
    const st = await api('/api/moomoo/status');
    $('#dot').classList.add('online');
    $('#bs').textContent = 'BRIDGE ONLINE' + (st.connected ? ' · MOOMOO LINKED' : '');
    $('#bs').style.color = 'var(--green)';
  } catch(e) {
    $('#dot').classList.remove('online');
    $('#bs').textContent = 'BRIDGE OFFLINE';
    $('#bs').style.color = 'var(--red)';
  }
}

function render() {
  $('#v').innerHTML = tab === 'picks' ? rPicks() : tab === 'paper' ? rPaper() : rSet();
  ['picks', 'paper', 'set'].forEach(t => {
    const el = document.getElementById('btn-' + t);
    if (el) el.classList.toggle('on', tab === t);
  });
}

function getUsMarketHolidayFixedOrObserved(year) {
  const holidays = new Set();
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const addObserved = (month, day) => {
    const d = new Date(Date.UTC(year, month - 1, day));
    const dow = d.getUTCDay();
    if (dow === 6) d.setUTCDate(d.getUTCDate() - 1);
    else if (dow === 0) d.setUTCDate(d.getUTCDate() + 1);
    holidays.add(fmt(d));
  };
  const nthWeekdayOfMonth = (month, weekday, n) => {
    const first = new Date(Date.UTC(year, month - 1, 1));
    const offset = (weekday - first.getUTCDay() + 7) % 7;
    return new Date(Date.UTC(year, month - 1, 1 + offset + (n - 1) * 7));
  };
  const lastWeekdayOfMonth = (month, weekday) => {
    const last = new Date(Date.UTC(year, month, 0));
    const offset = (last.getUTCDay() - weekday + 7) % 7;
    return new Date(Date.UTC(year, month - 1, last.getUTCDate() - offset));
  };

  addObserved(1, 1);
  addObserved(6, 19);
  addObserved(7, 4);
  addObserved(12, 25);
  holidays.add(fmt(nthWeekdayOfMonth(1, 1, 3)));
  holidays.add(fmt(nthWeekdayOfMonth(2, 1, 3)));
  holidays.add(fmt(lastWeekdayOfMonth(5, 1)));
  holidays.add(fmt(nthWeekdayOfMonth(9, 1, 1)));
  holidays.add(fmt(nthWeekdayOfMonth(11, 4, 4)));

  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const easterMonth = Math.floor((h + l - 7 * m + 114) / 31);
  const easterDay = ((h + l - 7 * m + 114) % 31) + 1;
  holidays.add(fmt(new Date(Date.UTC(year, easterMonth - 1, easterDay - 2))));

  return holidays;
}

const usHolidayCache = {};
function updateUsMarketClock() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    weekday: 'short',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
    timeZoneName: 'short'
  }).formatToParts(now);

  const map = {};
  for (const p of parts) map[p.type] = p.value;

  const year = Number(map.year);
  const dateKey = `${map.year}-${map.month}-${map.day}`;
  const hr = Number(map.hour) % 24;
  const min = Number(map.minute);
  const minsOfDay = hr * 60 + min;
  const isWeekend = map.weekday === 'Sat' || map.weekday === 'Sun';
  const holidays = (usHolidayCache[year] ??= getUsMarketHolidayFixedOrObserved(year));
  const isHoliday = holidays.has(dateKey);

  const isOpen = !isWeekend && !isHoliday && minsOfDay >= (9 * 60 + 30) && minsOfDay < (16 * 60);

  const dotEl = $('#us-mkt-dot');
  const lblEl = $('#us-mkt-lbl');
  const timeEl = $('#us-mkt-time');

  if (dotEl && lblEl) {
    dotEl.classList.toggle('online', isOpen);
    lblEl.textContent = isOpen ? 'US MARKET OPEN' : 'US MARKET CLOSED';
    lblEl.style.color = isOpen ? 'var(--green)' : 'var(--red)';
  }
  if (timeEl) {
    const pad = n => String(n).padStart(2, '0');
    timeEl.textContent = `${map.weekday} ${pad(hr)}:${pad(min)}:${pad(Number(map.second))} ${map.timeZoneName || 'ET'}`;
  }
}

// Initial Boot
render();
updateUsMarketClock();
ping();
setInterval(updateUsMarketClock, 1000);
setInterval(ping, 10000);
setInterval(refresh, 15000);
