/* ============ NORMALIZATION ============ */

const okey=(s,e,t,k)=>`${s}|${e}|${t}|${k}`;

async function fj(url,opt={}){const t0=performance.now(),ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);let r;
 try{r=await fetch(url,{...opt,signal:ac.signal})}catch(e){clearTimeout(to);throw e.name==='AbortError'?err('timeout','TIMEOUT'):err('network error or CORS blocked','NET')}
 clearTimeout(to);state.lat=Math.round(performance.now()-t0);
 if(r.status===401||r.status===403)throw err('authentication error ('+r.status+')','AUTH');if(r.status===429)throw err('rate limit reached','RATE');if(!r.ok)throw err('endpoint unavailable (HTTP '+r.status+')','HTTP');
 try{return await r.json()}catch(e){throw err('invalid response','BAD')}}
const Polygon={id:'polygon',name:'Polygon/Massive',real:true,
 get ok(){return state.creds.polygon.on&&!!state.creds.polygon.key},tk:s=>({VIX:'I:VIX',SPX:'I:SPX',NDX:'I:NDX'}[s]||s),
 async bars(s){const k=encodeURIComponent(state.creds.polygon.key),d=x=>new Date(x).toISOString().slice(0,10);
  const j=await fj(`https://api.polygon.io/v2/aggs/ticker/${this.tk(s)}/range/5/minute/${d(Date.now()-8*864e5)}/${d(Date.now()+864e5)}?adjusted=true&sort=desc&limit=300&apiKey=${k}`);
  if(!j.results||!j.results.length)throw err('no bars returned for '+s,'BAD');return j.results.reverse().map(r=>({t:r.t,o:r.o,h:r.h,l:r.l,c:r.c,v:r.v}))},
 async chain(s,spot){const k=encodeURIComponent(state.creds.polygon.key),mx=new Date(Date.now()+state.settings.maxDTE*864e5).toISOString().slice(0,10);
  let u=`https://api.polygon.io/v3/snapshot/options/${s}?limit=250&expiration_date.lte=${mx}&strike_price.gte=${Math.floor(spot*.92)}&strike_price.lte=${Math.ceil(spot*1.08)}&apiKey=${k}`,out=[];
  for(let p=0;p<4&&u;p++){const j=await fj(u);(j.results||[]).forEach(r=>{const d=r.details||{},q=r.last_quote||{},g=r.greeks||{},dy=r.day||{};
   out.push({exp:d.expiration_date,type:d.contract_type==='call'?'C':'P',strike:d.strike_price,bid:q.bid,ask:q.ask,last:dy.close,vol:dy.volume,oi:r.open_interest,iv:r.implied_volatility,delta:g.delta,gamma:g.gamma,theta:g.theta,vega:g.vega})});
   u=j.next_url?j.next_url+'&apiKey='+k:null}
  if(!out.length)throw err('OPTIONS DATA UNAVAILABLE (your plan may not include the options snapshot)','BAD');return out},
 async ping(){await this.bars('SPY')}};
const Proxy={id:'proxy',get name(){return state.creds.proxy.label},real:true,get ok(){return state.creds.proxy.on&&!!state.creds.proxy.url},
 req(path){const c=state.creds.proxy;if(!/^https:\/\//.test(c.url)&&!/^http:\/\/(localhost|127\.0\.0\.1)/.test(c.url))throw err('endpoint must be https:// (or localhost)','BAD');
  const h={};if(c.key)h['X-API-Key']=c.key;if(c.secret)h['X-API-Secret']=c.secret;return fj(c.url.replace(/\/$/,'')+path,{headers:h})},
 async bars(s){const j=await this.req('/bars?symbol='+s+'&tf=5');if(!Array.isArray(j)||!j.length)throw err('invalid bars response','BAD');return j},
 async chain(s){const j=await this.req('/chain?symbol='+s);if(!Array.isArray(j)||!j.length)throw err('OPTIONS DATA UNAVAILABLE','BAD');return j},
 async ping(){await this.bars('SPY')}};
const BASE={SPY:560,QQQ:490,IWM:215,DIA:420,VIX:17,NVDA:180,AAPL:225,MSFT:430,AMZN:195,META:580,GOOGL:170,TSLA:250,AMD:150,AVGO:170,NFLX:700,JPM:220,BAC:42,AMAT:190,MU:110,QCOM:165,PLTR:40};
const Demo={id:'demo',name:'DEMO / SIMULATED',real:false,get ok(){return state.mode==='demo'},
 async bars(s){const h=hash(s),base=BASE[s]||50+h%200,n=Math.floor(Date.now()/3e5),f=k=>base*(1+.025*Math.sin(k/55+h%7)+.008*Math.sin(k/9+h%5)+.004*(rnd(h+k)-.5)),o=[];
  for(let k=n-300;k<=n;k++){const a=f(k-1),c=f(k)+(k===n?base*.0015*Math.sin(Date.now()/20000+h):0);o.push({t:k*3e5,o:a,h:Math.max(a,c)*(1+.0008*rnd(h+k*2)),l:Math.min(a,c)*(1-.0008*rnd(h+k*5)),c,v:Math.round(1e5*(.6+rnd(h+k*3))*(1+200*Math.abs(c-a)/base))})}return o},
 async chain(s,spot){const h=hash(s),step=spot<50?1:spot<200?2.5:spot<500?5:10,atm=Math.round(spot/step)*step,out=[],N=x=>.5*(1+erf(x/Math.SQRT2));
  for(const d of [1,4,9,16,30])for(const t of ['C','P'])for(let i=-10;i<=10;i++){const K=atm+i*step,T=d/365,m=Math.abs(Math.log(K/spot)),iv=.32+.5*m+.04*rnd(h+K),sq=iv*Math.sqrt(T),d1=(Math.log(spot/K)+(.045+iv*iv/2)*T)/sq,d2=d1-sq,df=Math.exp(-.045*T);
   const px=t==='C'?spot*N(d1)-K*df*N(d2):K*df*N(-d2)-spot*N(-d1),pdf=Math.exp(-d1*d1/2)/Math.sqrt(2*Math.PI),mid=Math.max(.02,px),sp=Math.max(.01,mid*(.008+.12*m)),w=Math.exp(-m*18);
   out.push({exp:new Date(Date.now()+d*864e5).toISOString().slice(0,10),type:t,strike:K,bid:+(Math.max(.01,mid-sp/2)).toFixed(2),ask:+(mid+sp/2).toFixed(2),last:+mid.toFixed(2),vol:Math.round(25000*w*(.5+rnd(h+K+d))),oi:Math.round(40000*w*(.5+rnd(h+K*3+d))),iv,
    delta:t==='C'?N(d1):N(d1)-1,gamma:pdf/(spot*sq),theta:-(spot*pdf*iv)/(2*Math.sqrt(T))/365,vega:spot*pdf*Math.sqrt(T)/100})}return out},
 async ping(){}};
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
const provs=()=>state.mode==='demo'?[Demo]:[Polygon,Proxy].filter(p=>p.ok).sort((a,b)=>(a.id===state.settings.primary?-1:1)-(b.id===state.settings.primary?-1:1));
/* ============ INDICATORS ============ */
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map((v,i)=>i?e=v*k+e*(1-k):e)};
function rsi(c,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l===0?100:100-100/(1+g/l)}
function atr(b,n=14){const tr=b.slice(1).map((x,i)=>Math.max(x.h-x.l,Math.abs(x.h-b[i].c),Math.abs(x.l-b[i].c)));return avg(tr.slice(-n))}
function vwap(b){const d=et(new Date(b[b.length-1].t)).date,s=b.filter(x=>et(new Date(x.t)).date===d);let pv=0,v=0;s.forEach(x=>{pv+=(x.h+x.l+x.c)/3*x.v;v+=x.v});return v?pv/v:b[b.length-1].c}
function agg(b,k){if(k===1)return b;const o=[];for(let i=b.length%k;i+k<=b.length;i+=k){const s=b.slice(i,i+k);o.push({t:s[0].t,o:s[0].o,h:Math.max(...s.map(x=>x.h)),l:Math.min(...s.map(x=>x.l)),c:s[k-1].c,v:s.reduce((a,x)=>a+x.v,0)})}return o}
function macdH(c){const a=ema(c,12),b=ema(c,26),m=a.map((v,i)=>v-b[i]),s=ema(m,9);return m[m.length-1]-s[s.length-1]}
function analyze(b){if(!b||b.length<60)return null;const c=b.map(x=>x.c),L=c.length-1,e9=ema(c,9)[L],e20=ema(c,20)[L],e50=ema(c,50)[L],v=b.map(x=>x.v);
 const r=c.slice(-60).slice(1).map((x,i)=>Math.log(x/c.slice(-60)[i])),mu=avg(r),hv=Math.sqrt(avg(r.map(x=>(x-mu)**2)))*Math.sqrt(78*252);
 const c15=agg(b,3).map(x=>x.c),t15=c15.length>21?(ema(c15,9)[c15.length-1]>ema(c15,20)[c15.length-1]?1:-1):0,pr=b.slice(-21,-1),
 lw=b.slice(-8).map(x=>x.l),lp=b.slice(-16,-8).map(x=>x.l),hw=b.slice(-8).map(x=>x.h),hp=b.slice(-16,-8).map(x=>x.h);
 return{c:c[L],e9,e20,e50,rsi:rsi(c),mh:macdH(c),vwap:vwap(b),atr:atr(b),rv:v[L]/(avg(v.slice(-21,-1))||1),hv,t15,hh:Math.max(...pr.map(x=>x.h)),ll:Math.min(...pr.map(x=>x.l)),hl:Math.min(...lw)>Math.min(...lp),lh:Math.max(...hw)<Math.max(...hp),t:b[L].t,vol:v[L],spark:c.slice(-60),bars:b}}
function mtf(b){return[['5m',1],['15m',3],['30m',6],['1h',12]].map(([n,k])=>{const a=agg(b,k),c=a.map(x=>x.c);if(c.length<27)return{n,na:true};const L=c.length-1,e9=ema(c,9)[L],e20=ema(c,20)[L],mh=macdH(c),rs=rsi(c),vw=vwap(b);
  const tr=Math.abs(e9-e20)/c[L]<.0005?0:e9>e20?1:-1,mo=rs>55?1:rs<45?-1:0,sg=tr+(mh>0?1:-1)+(c[L]>vw?1:-1);return{n,tr,mo,mh,rs,vw:c[L]>vw?1:-1,sg:sg>=2?1:sg<=-2?-1:0}})}
const lab=x=>x>0?'<span class="g">▲ Bullish</span>':x<0?'<span class="r">▼ Bearish</span>':'<span class="y">● Neutral</span>';
/* ============ SIGNAL ENGINE ============ */
function regime(){const a=state.an,v=['SPY','QQQ','IWM','DIA'].map(s=>a[s]).filter(Boolean);if(v.length<2)return null;
 const sc=v.map(x=>(x.e9>x.e20&&x.c>x.vwap)?1:(x.e9<x.e20&&x.c<x.vwap)?-1:0),sum=sc.reduce((p,q)=>p+q,0),vx=a.VIX,hv=vx&&(vx.c>28||(vx.c/vx.spark[vx.spark.length-13]-1)>.06);
 return{dir:sum>=2?1:sum<=-2?-1:0,hv:!!hv,vix:vx?vx.c:null,txt:hv?'⚠️ High Volatility':sum>=2?'🟢 Bullish':sum<=-2?'🔴 Bearish':'🟡 Neutral'}}
function preScore(an,dir,reg){const up=dir>0,c=an.c,k={};
 const n=(up?[an.e9>an.e20,an.e20>an.e50,c>an.e50,an.t15>0]:[an.e9<an.e20,an.e20<an.e50,c<an.e50,an.t15<0]).filter(Boolean).length;k.trend=20*n/4;
 const ro=up?(an.rsi>=50&&an.rsi<=72?1:an.rsi>=42&&an.rsi<50?.5:0):(an.rsi<=50&&an.rsi>=28?1:an.rsi>50&&an.rsi<=58?.5:0);k.momentum=15*(ro*.5+((up?an.mh>0:an.mh<0)?.5:0));
 k.vwap=(up?c>an.vwap:c<an.vwap)?15:0;k.volume=an.rv>=1.5?10:an.rv>=1.1?6:2;

 k.marketRegime=!reg||reg.dir===0?5:reg.dir===dir?10:1;if(reg&&reg.hv)k.marketRegime=Math.min(k.marketRegime,3);return k}

function pickStrike(rows,dir,why){const s=state.settings,t=dir>0?'C':'P',cnt={dte:0,delta:0,liq:0,greeks:0};
 const ok=rows.filter(r=>{if(r.type!==t)return false;const d=dte(r.exp);if(d<s.minDTE||d>s.maxDTE){return false}

 case'test':test(v);break;case'connect':{const c=state.creds[v];if(v==='polygon'&&!c.key||v==='proxy'&&!c.url){toast('Enter the required fields first');break}c.on=true;state.conn[v]='Connected (not yet verified — press TEST)';state.forceRender=1;render();state.forceRender=0;break}
 case'disc':state.creds[v].on=false;state.conn[v]='Disconnected';state.forceRender=1;render();state.forceRender=0;break;
 case'clear':state.creds[v]=v==='polygon'?{key:'',on:false}:{url:'',key:'',secret:'',label:'Moomoo (via your proxy)',on:false};state.conn[v]='Not configured';state.forceRender=1;render();state.forceRender=0;break;
 case'chart':{const p=pk();if(p)openChart(p.sym,p.dir,p.exp,p.strike,p.type);break}
 case'tchart':{const t=state.trades.find(x=>x.id===id);if(t)openChart(t.sym,t.dir,t.exp,t.strike,t.type);break}
 case'detail':{const p=pk();if(p){$('#modal').innerHTML=vDetail(p);$('#modal').style.display='block'}break}
 case'mtf':{$('#modal').innerHTML=`<div class="card"><div class="btns" style="justify-content:flex-end"><button data-a="close-modal">✕ Close</button></div>${mtfHTML(v)}<p class="mu">1m, 3m and daily frames are not computed in this version.</p></div>`;$('#modal').style.display='block';break}
 case'close-modal':$('#modal').style.display='none';break;
 case'add':{addPaper(id);$('#modal').style.display='none';break}
 case'rej':state.picks=state.picks.filter(p=>p.id!==id);$('#modal').style.display='none';render();break;
 case'edit-qty':
 case'qty':{const t=state.trades.find(x=>x.id===id);if(t){const v=prompt(`Edit contract quantity for ${t.sym} ${t.dir>0?'CALL':'PUT'} $${t.strike} (Exp: ${t.exp}):`,t.qty);if(v!==null){const n=parseInt(v.trim(),10);if(!isNaN(n)&&n>0){t.qty=n;save();render();toast(`Updated ${t.sym} quantity to ${n}`)}else{toast('Invalid quantity: must be 1 or greater')}}}break}
 case'close':{const t=state.trades.find(x=>x.id===id);closeTrade(id,t&&t.cur!=null&&t.sim===curSim()?t.cur:null);break}
 case'del':if(confirm('Delete this paper trade? It will not count in P&L.')){state.trades=state.trades.filter(t=>t.id!==id);save();render()}break;
 case'clear-closed':{const tgt=v==='all'?'ALL':v==='true'?'DEMO':'LIVE';if(confirm(`Permanently delete ${tgt==='ALL'?'all':tgt} closed trades from history? This cannot be undone.`)){state.trades=state.trades.filter(t=>t.status==='OPEN'||(tgt!=='ALL'&&t.sim!==(v==='true')));save();render();toast('History cleared')}break;}
 case'csv':exportData('csv');break;case'json':exportData('json');break;
 case'wadd':{const i=$('#wsym'),s=i.value.trim().toUpperCase();if(/^[A-Z.]{1,6}$/.test(s)&&!state.watch.includes(s)){state.watch.push(s);save();state.forceRender=1;render();state.forceRender=0}break}
 case'wdel':state.watch=state.watch.filter(s=>s!==v);save();state.forceRender=1;render();state.forceRender=0;break;
 case'wreset':state.watch=['NVDA','AAPL','MSFT','AMZN','META','GOOGL','TSLA','AMD','AVGO','NFLX','JPM','BAC','AMAT','MU','QCOM','PLTR','SPY','QQQ','IWM','DIA'];save();state.forceRender=1;render();state.forceRender=0;break;
 case'sreset':state.settings={...DEF};save();state.forceRender=1;render();state.forceRender=0;setTimer();break}});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.a;if(!a)return;
 if(a==='set-pick-qty'){const p=state.picks.find(x=>x.id===t.dataset.id);if(p){const n=parseInt(t.value,10);if(n>0)p.customQty=n}}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(!a)return;
 if(a==='set'){const n=parseFloat(t.value);if(!isNaN(n)){state.settings[t.dataset.k]=n;save()}}
 else if(a==='set-pick-qty'){const p=state.picks.find(x=>x.id===t.dataset.id);if(p){const n=parseInt(t.value,10);if(n>0)p.customQty=n}}
 else if(a==='setc'){state.settings.chart=t.value;save()}else if(a==='setac'){state.settings.autoClose=t.value==='1';save()}
 else if(a==='prim'){state.settings.primary=t.value;save();state.forceRender=1;render();state.forceRender=0}
 else if(a==='rf'){state.settings.refresh=+t.value;save();setTimer()}
 else if(a==='cred')state.creds[t.dataset.p][t.dataset.k]=t.value.trim();
 else if(a==='view'){state.view=t.value;render()}
 else if(a==='csym'){state.chainSel=t.value;state.chainExp=null;render()}else if(a==='cexp'){state.chainExp=t.value;render()}});
setInterval(()=>{const c=$('#clk'),p=et();if(c)c.textContent=`${p.hour}:${p.minute}:${p.second}`},1000);
render();setTimer();
</script></body></html>
